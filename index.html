<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tetris Multiplayer - Arcade VS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="arcade-bg"></div>
    <div class="container">
        <div class="arcade-cabinet">
            <div class="screen">
                <div id="lobby" class="lobby">
                    <h1 class="arcade-title">TETRIS</h1>
                    <h2 class="subtitle">MULTIPLAYER VS</h2>
                    <input type="text" id="player-name" placeholder="SEU NOME" maxlength="15">
                    <button id="create-room" class="arcade-btn">CRIAR SALA</button>
                    <div id="room-info" class="room-info" style="display:none">
                        <span id="room-code"></span>
                        <button id="share-room" class="arcade-btn small">COMPARTILHAR</button>
                    </div>
                    <div id="waiting-msg" class="waiting" style="display:none">AGUARDANDO OPONENTE...</div>
                </div>

                <div id="game-area" class="game-area" style="display:none">
                    <div class="vs-header">
                        <div class="player-panel" id="panel-p1">
                            <span class="player-name" id="p1-name">JOGADOR 1</span>
                            <div class="stats">
                                <div>LINES: <span id="p1-lines">0</span></div>
                                <div>SCORE: <span id="p1-score">0</span></div>
                            </div>
                            <div class="status-led" id="p1-status">🟢</div>
                        </div>
                        <div class="vs-divider">VS</div>
                        <div class="player-panel" id="panel-p2">
                            <span class="player-name" id="p2-name">JOGADOR 2</span>
                            <div class="stats">
                                <div>LINES: <span id="p2-lines">0</span></div>
                                <div>SCORE: <span id="p2-score">0</span></div>
                            </div>
                            <div class="status-led" id="p2-status">🟢</div>
                        </div>
                    </div>
                    <div class="boards-container">
                        <div class="board-wrapper">
                            <canvas id="board1" width="300" height="600"></canvas>
                        </div>
                        <div class="board-wrapper">
                            <canvas id="board2" width="300" height="600"></canvas>
                        </div>
                    </div>
                    <div class="controls">
                        <span>← → ↓  |  ↑ GIRAR  |  ESPAÇO QUEDA</span>
                    </div>
                    <button id="reset-game" class="arcade-btn reset">NOVA RODADA</button>
                </div>
            </div>
        </div>
    </div>

    <div id="victory-overlay">
        <div class="victory-card">
            <h2 id="winner-message"></h2>
            <button id="close-overlay" class="arcade-btn">FECHAR</button>
        </div>
    </div>

    <script src="tetris.js"></script>
</body>
</html>
