<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tetris Multiplayer - Arcade VS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="arcade-bg"></div>
    <div class="container">
        <div class="arcade-cabinet">
            <div class="screen">
                <div id="lobby" class="lobby">
                    <h1 class="arcade-title">TETRIS</h1>
                    <h2 class="subtitle">MULTIPLAYER VS</h2>
                    <input type="text" id="player-name" placeholder="SEU NOME" maxlength="15">
                    <div class="mode-selector">
                        <label>MODO DE JOGO:</label>
                        <select id="game-mode">
                            <option value="solo">SOLO</option>
                            <option value="2players" selected>2 JOGADORES</option>
                            <option value="3players">3 JOGADORES</option>
                            <option value="4players">4 JOGADORES</option>
                        </select>
                    </div>
                    <button id="create-room" class="arcade-btn">CRIAR SALA</button>
                    <div id="room-info" class="room-info" style="display:none">
                        <span id="room-code"></span>
                        <button id="share-room" class="arcade-btn small">COMPARTILHAR</button>
                        <span id="players-count" style="color:#88ffaa;">0/0</span>
                    </div>
                    <div id="link-display" style="display:none; margin-top:10px; width:100%; max-width:400px;">
                        <input type="text" id="share-link" readonly style="width:100%; padding:10px; border-radius:20px; background:#111; color:#88ccff; border:1px solid #ffcc33; text-align:center; font-size:0.9rem; outline:none;">
                    </div>
                    <div id="waiting-msg" class="waiting" style="display:none">AGUARDANDO JOGADORES...</div>
                    <div id="players-list" class="players-list" style="display:none"></div>
                </div>

                <div id="game-area" class="game-area" style="display:none">
                    <div class="vs-header" id="vs-header">
                        <div class="player-panel" id="panel-p1">
                            <span class="player-name" id="p1-name">JOGADOR 1</span>
                            <div class="stats">
                                <div>LINES: <span id="p1-lines">0</span></div>
                                <div>SCORE: <span id="p1-score">0</span></div>
                            </div>
                            <div class="status-led" id="p1-status">🟢</div>
                        </div>
                        <div class="vs-divider" id="vs-divider">VS</div>
                        <div class="player-panel" id="panel-p2">
                            <span class="player-name" id="p2-name">JOGADOR 2</span>
                            <div class="stats">
                                <div>LINES: <span id="p2-lines">0</span></div>
                                <div>SCORE: <span id="p2-score">0</span></div>
                            </div>
                            <div class="status-led" id="p2-status">🟢</div>
                        </div>
                        <div class="player-panel" id="panel-p3" style="display:none">
                            <span class="player-name" id="p3-name">JOGADOR 3</span>
                            <div class="stats">
                                <div>LINES: <span id="p3-lines">0</span></div>
                                <div>SCORE: <span id="p3-score">0</span></div>
                            </div>
                            <div class="status-led" id="p3-status">🟢</div>
                        </div>
                        <div class="player-panel" id="panel-p4" style="display:none">
                            <span class="player-name" id="p4-name">JOGADOR 4</span>
                            <div class="stats">
                                <div>LINES: <span id="p4-lines">0</span></div>
                                <div>SCORE: <span id="p4-score">0</span></div>
                            </div>
                            <div class="status-led" id="p4-status">🟢</div>
                        </div>
                    </div>
                    <div class="boards-container" id="boards-container">
                        <div class="board-wrapper">
                            <canvas id="board1" width="300" height="600"></canvas>
                        </div>
                        <div class="board-wrapper">
                            <canvas id="board2" width="300" height="600"></canvas>
                        </div>
                        <div class="board-wrapper" style="display:none">
                            <canvas id="board3" width="300" height="600"></canvas>
                        </div>
                        <div class="board-wrapper" style="display:none">
                            <canvas id="board4" width="300" height="600"></canvas>
                        </div>
                    </div>
                    <div class="controls">
                        <span id="controls-text">JOGADOR 1: ← → ↓ | ↑ GIRAR | ESPAÇO QUEDA</span>
                    </div>
                    <div class="touch-controls" id="touch-controls">
                        <div class="touch-row">
                            <button class="touch-btn" data-action="left">◀</button>
                            <button class="touch-btn" data-action="rotate">🔄</button>
                            <button class="touch-btn" data-action="right">▶</button>
                        </div>
                        <div class="touch-row">
                            <button class="touch-btn" data-action="down">▼</button>
                            <button class="touch-btn" data-action="drop">⬇⬇</button>
                        </div>
                    </div>
                    <button id="reset-game" class="arcade-btn reset">NOVA RODADA</button>
                    <button id="exit-game" class="arcade-btn reset" style="background:#ff3366;border-color:#ff3366;">SAIR</button>
                </div>
            </div>
        </div>
    </div>

    <div id="victory-overlay">
        <div class="victory-card">
            <h2 id="winner-message"></h2>
            <div id="ranking-display" style="margin:20px 0;"></div>
            <button id="close-overlay" class="arcade-btn">FECHAR</button>
        </div>
    </div>

    <script src="tetris.js"></script>
</body>
</html>
