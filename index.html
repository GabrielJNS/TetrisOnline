<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tetris Multiplayer - VS Online</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
</head>
<body>
<div class="bg-gradient"></div>
<div class="container">
    <div class="game-card">
        <div class="header">
            <h1>🎮 Tetris Multiplayer</h1>
            <p>VS — Quem perder primeiro, perde!</p>
        </div>

        <div id="lobby">
            <input type="text" id="player-name" placeholder="Seu nome">
            <button id="create-room">🚀 Criar Sala</button>
            <div id="room-info" style="display:none; margin-top:15px;">
                <span id="room-code"></span>
                <button id="share-room">📎 Compartilhar</button>
            </div>
            <div id="waiting-msg" style="display:none;">Aguardando oponente...</div>
        </div>

        <div id="game-area" style="display:none;">
            <div class="players-panel">
                <div class="player-stats player1">
                    <h3>👤 <span id="p1-name">Jogador 1</span></h3>
                    <p>Linhas: <span id="p1-lines">0</span></p>
                    <p>Pontos: <span id="p1-score">0</span></p>
                    <div class="status" id="p1-status">🟢 Jogando</div>
                </div>
                <div class="player-stats player2">
                    <h3>👥 <span id="p2-name">Jogador 2</span></h3>
                    <p>Linhas: <span id="p2-lines">0</span></p>
                    <p>Pontos: <span id="p2-score">0</span></p>
                    <div class="status" id="p2-status">🟢 Jogando</div>
                </div>
            </div>
            <div class="tetris-boards">
                <div class="board-container">
                    <canvas id="board1" width="300" height="600"></canvas>
                </div>
                <div class="vs">⚔️ VS ⚔️</div>
                <div class="board-container">
                    <canvas id="board2" width="300" height="600"></canvas>
                </div>
            </div>
            <div class="controls-info">
                ← → ↓ mover | ↑ girar | Espaço: queda rápida
            </div>
            <button id="reset-game" class="reset-btn">🔄 Nova Rodada</button>
        </div>
    </div>
</div>

<div id="victory-overlay">
    <div class="victory-box">
        <h2 id="winner-message"></h2>
        <button id="close-overlay">💖 Fechar</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
